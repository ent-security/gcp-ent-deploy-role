name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    uses: ent-security/ent-actions/.github/workflows/release-please.yml@release-please-v1
    permissions:
      contents: write          # create the release commit, tag, and GitHub Release
      pull-requests: write      # open/update the release PR
    secrets:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
