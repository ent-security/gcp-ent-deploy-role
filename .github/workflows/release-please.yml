name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    uses: ent-security/ent-actions/.github/workflows/release-please.yml@04d7c7176429d7d505f0d119d0c1e5044f6f41b6 # TODO: switch to @release-please-v1 once ent-security/ent-actions#11 is merged and tagged
    permissions:
      contents: write          # create the release commit, tag, and GitHub Release
      pull-requests: write      # open/update the release PR
    secrets:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
